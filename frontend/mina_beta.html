<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINA — Bêta</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f5f0eb;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    background: white;
    border-radius: 16px;
    padding: 40px;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo h1 {
    font-size: 2rem;
    color: #c8956c;
    letter-spacing: 4px;
    font-weight: 300;
  }
  .logo p {
    color: #999;
    font-size: 0.85rem;
    margin-top: 4px;
  }
  textarea {
    width: 100%;
    padding: 16px;
    border: 1px solid #e0d6cc;
    border-radius: 10px;
    font-size: 1rem;
    resize: vertical;
    min-height: 100px;
    font-family: inherit;
    color: #333;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: #c8956c; }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 16px;
    background: #c8956c;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
    letter-spacing: 1px;
  }
  button:hover { background: #b07d56; }
  button:disabled { background: #ddd; cursor: not-allowed; }
  .response-box {
    margin-top: 24px;
    padding: 20px;
    background: #fdf8f4;
    border-left: 3px solid #c8956c;
    border-radius: 8px;
    display: none;
  }
  .response-box.visible { display: block; }
  .response-text {
    color: #333;
    line-height: 1.7;
    font-size: 0.95rem;
  }
  .meta {
    margin-top: 12px;
    font-size: 0.75rem;
    color: #aaa;
  }
  .spinner {
    display: none;
    text-align: center;
    margin-top: 16px;
    color: #c8956c;
  }
  .spinner.visible { display: block; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <h1>MINA</h1>
    <p>Assistante Body Minute — Version Bêta</p>
  </div>

  <textarea id="question" placeholder="Posez votre question à MINA...
Ex: Quels sont les actifs de la cure silhouette ?"></textarea>

  <button id="btn" onclick="ask()">Demander à MINA</button>

  <div class="spinner" id="spinner">⏳ MINA réfléchit...</div>

  <div class="response-box" id="response-box">
    <div class="response-text" id="response-text"></div>
    <div class="meta" id="meta"></div>
  </div>
</div>

<script>
const API_URL = "http://localhost:8000/conversation";

async function ask() {
  const question = document.getElementById("question").value.trim();
  if (!question) return;

  const btn = document.getElementById("btn");
  const spinner = document.getElementById("spinner");
  const box = document.getElementById("response-box");
  const responseText = document.getElementById("response-text");
  const meta = document.getElementById("meta");

  btn.disabled = true;
  spinner.classList.add("visible");
  box.classList.remove("visible");

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user_input: question,
        session_id: "beta_" + Date.now(),
        institut_id: "laurence_01"
      })
    });

    const data = await res.json();

    if (data.success) {
      responseText.textContent = data.response;
      meta.textContent = `Agents: ${data.agents_called.join(", ")} — ${data.processing_time_ms}ms`;
    } else {
      responseText.textContent = "Une erreur est survenue. Veuillez réessayer.";
      meta.textContent = "";
    }
  } catch (e) {
    responseText.textContent = "Impossible de joindre MINA. Vérifiez que le serveur est démarré.";
    meta.textContent = "";
  }

  spinner.classList.remove("visible");
  box.classList.add("visible");
  btn.disabled = false;
}

document.getElementById("question").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && e.ctrlKey) ask();
});
</script>
</body>
</html>
