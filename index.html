<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FF6B9D">
    
    <title>MINA - Assistant Body Minute</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: white;
        }
        
        /* Header */
        .header {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.2);
        }
        
        .logo {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }
        
        /* Main container */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        
        /* Body Touch Button */
        .body-touch-container {
            position: relative;
            margin-bottom: 40px;
        }
        
        .body-touch {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(145deg, #FF6B9D, #C94277);
            box-shadow: 
                0 10px 40px rgba(0,0,0,0.3),
                inset 0 -5px 10px rgba(0,0,0,0.2),
                inset 0 5px 10px rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 5px solid rgba(255,255,255,0.3);
        }
        
        .body-touch:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 15px 50px rgba(0,0,0,0.4),
                inset 0 -5px 10px rgba(0,0,0,0.2),
                inset 0 5px 10px rgba(255,255,255,0.2);
        }
        
        .body-touch:active {
            transform: translateY(0) scale(0.95);
            box-shadow: 
                0 5px 20px rgba(0,0,0,0.3),
                inset 0 2px 5px rgba(0,0,0,0.3);
        }
        
        .body-touch.listening {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .touch-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }
        
        .touch-text {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
        }
        
        /* Finger pointer */
        .finger {
            position: absolute;
            top: -30px;
            right: -30px;
            font-size: 50px;
            animation: point 2s infinite;
        }
        
        @keyframes point {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-10px, 10px); }
        }
        
        /* Status */
        .status {
            font-size: 24px;
            margin-bottom: 20px;
            height: 30px;
            opacity: 0.9;
        }
        
        /* Response area */
        .response-area {
            max-width: 80%;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
            display: none;
        }
        
        .response-area.visible {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .response-text {
            font-size: 18px;
            line-height: 1.6;
        }
        
        /* Loading animation */
        .loading {
            display: none;
            margin-top: 20px;
        }
        
        .loading.visible {
            display: flex;
            gap: 10px;
        }
        
        .loading-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: white;
            animation: bounce 1.4s infinite ease-in-out;
        }
        
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🌸 MINA</div>
        <div class="subtitle">Assistant Body Minute</div>
    </div>
    
    <div class="container">
        <div class="status" id="status">👆 Touchez le Body Touch pour parler</div>
        
        <div class="body-touch-container">
            <div class="body-touch" id="bodyTouch">
                <div class="touch-icon">💅</div>
                <div class="touch-text">BODY TOUCH</div>
            </div>
            <div class="finger" id="finger">☝️</div>
        </div>
        
        <div class="loading" id="loading">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
        </div>
        
        <div class="response-area" id="responseArea">
            <div class="response-text" id="responseText"></div>
        </div>
    </div>
    
    <script src="app.js"></script>
    
    <script>
        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.error('Service Worker registration failed:', err));
        }
    </script>
</body>
</html>
