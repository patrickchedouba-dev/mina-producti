version: '3.8'

# Docker Compose pour Mina - Services de Mémoire
# Usage: docker-compose up -d

services:
  # Redis - Mémoire Court Terme (Sessions)
  redis:
    image: redis:7-alpine
    container_name: mina-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL - Mémoire Long Terme (Historique + Profils)
  postgres:
    image: postgres:15-alpine
    container_name: mina-postgres
    environment:
      POSTGRES_USER: mina
      POSTGRES_PASSWORD: mina
      POSTGRES_DB: mina
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mina -d mina"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
