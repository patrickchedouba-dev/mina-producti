services:
  # Backend FastAPI
  - type: web
    name: mina-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: QDRANT_HOST
        value: localhost
      - key: QDRANT_PORT
        value: 6333
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
  
  # Frontend Static
  - type: web
    name: mina-frontend
    env: static
    region: frankfurt
    plan: free
    buildCommand: "echo 'No build needed'"
    staticPublishPath: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
